# 均时差逐日表【B1-1】——W-05 中可在数据侧检查的部分
[eot]
definition = "视太阳时 − 平太阳时（秒）"
rows = 73415
first_date = "1900-01-01"
last_date = "2101-01-01"
feb_min_minutes = [-15.0, -13.5]      # 每年 1–3 月极小值所在区间
nov_max_minutes = [16.0, 17.0]        # 每年 9–12 月极大值所在区间
zero_anchors = ["04-15", "06-13", "09-01", "12-25"]
zero_tolerance_days = 3
max_interp_error_seconds = 5.0

# CFG-01（zi_rule）第一版锁定值【用户裁决 N-6】：契约 §13.3、P-8.1“第一版锁定 ye_zi_b”。
# E2 DDL 生成脚本由此读取，写入用户库 CFG-01 的库层拦截（审核清单 §8.1；E2 实施授权书 Q-8）。
[cfg01]
locked_value = "ye_zi_b"
decision = "N-6"

# 必备阻断登记【契约 §9.5 B1–B4 最小阻断集；附录 BLK.1 七项】——E2-FIX-2 P1-3（失效关闭）
# 计算判定时正式库 blocker 表须含下列全部阻断；缺任何一项按导入遗漏处理（BLOCKED-FORMAL，不生成快照）。
# verify.py 核对：契约 §9.5 表行与附录 BLK.1 表行恰为这 11 项。
[blockers]
required = ["B1", "B2", "B3", "B4", "BLK-1", "BLK-2", "BLK-3", "BLK-4", "BLK-5", "BLK-6", "BLK-7"]
